name: Browser preview checks
on:
  push:
    branches: [main, "feature/**", "arena/**"]
    paths: ["web-preview/**", ".github/workflows/web-preview.yml"]
  pull_request:
    paths: ["web-preview/**", ".github/workflows/web-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-preview/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run export:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Browser-test-diagnostics
          path: web-preview/test-results/
          if-no-files-found: ignore
