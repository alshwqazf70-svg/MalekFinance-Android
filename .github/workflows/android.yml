name: Android build
on:
  push:
    branches: [main, "feature/**", "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malek-finance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.MALEK_FINANCE_KEYSTORE_BASE64 != '' && secrets.MALEK_FINANCE_KEYSTORE_PASSWORD != '' && secrets.MALEK_FINANCE_KEY_ALIAS != '' && secrets.MALEK_FINANCE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MK-Finance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare protected release signing key
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MALEK_FINANCE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MALEK_FINANCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MALEK_FINANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MALEK_FINANCE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malek-finance-release.jks"
          {
            echo "MALEK_FINANCE_RELEASE_STORE_FILE=$RUNNER_TEMP/malek-finance-release.jks"
            echo "MALEK_FINANCE_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MALEK_FINANCE_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "MALEK_FINANCE_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MK-Finance-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Compile instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      # Run emulator-dependent checks after publishing build artifacts so a
      # transient hosted-emulator boot failure cannot prevent APK retrieval.
      - name: Run Room instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Expose failure diagnostics in check annotations
        if: ${{ failure() }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'finance-gradle.log'
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              for start in range(max(0, len(lines) - 90), len(lines), 15):
                  text = '\n'.join(lines[start:start + 15])[:5000]
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Gradle diagnostics::' + text)
          PYCODE
