name: Android build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING:  ${{ env.HAS_RELEASE_SIGNING == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run Room instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalekFinance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare protected release signing key
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MALEK_FINANCE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MALEK_FINANCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MALEK_FINANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MALEK_FINANCE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malek-finance-release.jks"
          {
            echo "MALEK_FINANCE_RELEASE_STORE_FILE=$RUNNER_TEMP/malek-finance-release.jks"
            echo "MALEK_FINANCE_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MALEK_FINANCE_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "MALEK_FINANCE_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        if:  ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        if:  ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MalekFinance-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
