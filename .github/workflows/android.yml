name: Android build
on:
  push:
    branches: [main, "feature/**", "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malek-finance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.MALEK_FINANCE_KEYSTORE_BASE64 != '' && secrets.MALEK_FINANCE_KEYSTORE_PASSWORD != '' && secrets.MALEK_FINANCE_KEY_ALIAS != '' && secrets.MALEK_FINANCE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enforce no-emulator policy
        run: python3 scripts/check-no-emulators.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      - name: Record APK checksum and test build identity
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          printf 'MK Finance Debug test build\nSource commit: %s\nNot a production release. Back up existing data before updating.\n' "$GITHUB_SHA" > BUILD-INFO.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MK-Finance-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
      - name: Prepare protected release signing key
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MALEK_FINANCE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MALEK_FINANCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MALEK_FINANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MALEK_FINANCE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/malek-finance-release.jks"
          {
            echo "MALEK_FINANCE_RELEASE_STORE_FILE=$RUNNER_TEMP/malek-finance-release.jks"
            echo "MALEK_FINANCE_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MALEK_FINANCE_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "MALEK_FINANCE_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MK-Finance-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Compile instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug 2>&1 | tee -a "$RUNNER_TEMP/finance-gradle.log"
      # No Android virtual devices or connected tests in CI, by product-owner request.
      # Instrumentation APK compilation above is retained; execution is on real devices only.

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Expose failure diagnostics in check annotations
        if: ${{ failure() }}
        run: |
          python3 - <<'PYCODE'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for report in Path('app/build').rglob('TEST-*.xml'):
              try:
                  tree = ET.parse(report)
                  for case in tree.iter('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          message = (case.get('classname', '') + '.' + case.get('name', '') + ': ' + (failure.text or failure.get('message', '')))[:5000]
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error title=Test failure::' + message)
              except ET.ParseError:
                  pass
          path = Path(os.environ['RUNNER_TEMP']) / 'finance-gradle.log'
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              for start in range(max(0, len(lines) - 90), len(lines), 15):
                  text = '\n'.join(lines[start:start + 15])[:5000]
                  text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Gradle diagnostics::' + text)
          PYCODE
